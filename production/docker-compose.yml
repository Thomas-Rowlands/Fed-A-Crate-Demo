# docker-compose.yml
# ─────────────────────────────────────────────────────────────────────────
# Orchestrates the federated PRS demo: one central server + three TRE
# clients, each with their own private cohort CSV.
#
# Usage:
#     docker compose up --build       # build images and run
#     docker compose down -v          # stop and clean volumes
#     docker compose logs -f tre1     # follow TRE 1's logs
#
# CSV files live in ./data/ under their original names:
#     USA_young.csv  → TRE 1
#     USA_old.csv    → TRE 2
#     USA_normal.csv → TRE 3
#
# Each is mounted into its container as a single read-only file so the
# original filename stays visible to anyone inspecting this compose file.
#
# Final model is written to ./results/ on the host once the run completes.
# ─────────────────────────────────────────────────────────────────────────

services:

  # ── Central aggregation server ────────────────────────────────────────
  fed-server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: prs-fed-server:latest
    container_name: fed-server
    hostname: fed-server
    networks:
      - fed-net
    ports:
      - "8080:8080"
    volumes:
      - ./results:/results
    environment:
      FLWR_HOST:   0.0.0.0
      FLWR_PORT:   "8080"
      ROUNDS:      "10"
      NUM_CLIENTS: "3"
      N_FEATURES:  "313"
      RESULTS_DIR: /results
      # Uncomment to enable TLS (requires ./certs populated):
      # CERTS_DIR: /certs
    # volumes:
    #   - ./certs:/certs:ro

  # ── TRE 1: Young cohort ───────────────────────────────────────────────
  tre1:
    build:
      context: ./client
      dockerfile: Dockerfile
    image: prs-fed-client:latest
    container_name: tre1
    networks:
      - fed-net
    depends_on:
      - fed-server
    volumes:
      - ./data/USA_young.csv:/data/USA_young.csv:ro
    environment:
      FLWR_SERVER:   fed-server:8080
      COHORT_CSV:    /data/USA_young.csv
      COHORT_LABEL:  USA_young
      TRE_NUM:       "1"

  # ── TRE 2: Old cohort ─────────────────────────────────────────────────
  tre2:
    image: prs-fed-client:latest
    container_name: tre2
    networks:
      - fed-net
    depends_on:
      - fed-server
      - tre1            # build only once via tre1
    volumes:
      - ./data/USA_old.csv:/data/USA_old.csv:ro
    environment:
      FLWR_SERVER:   fed-server:8080
      COHORT_CSV:    /data/USA_old.csv
      COHORT_LABEL:  USA_old
      TRE_NUM:       "2"

  # ── TRE 3: Normal cohort ──────────────────────────────────────────────
  tre3:
    image: prs-fed-client:latest
    container_name: tre3
    networks:
      - fed-net
    depends_on:
      - fed-server
      - tre1
    volumes:
      - ./data/USA_normal.csv:/data/USA_normal.csv:ro
    environment:
      FLWR_SERVER:   fed-server:8080
      COHORT_CSV:    /data/USA_normal.csv
      COHORT_LABEL:  USA_normal
      TRE_NUM:       "3"


networks:
  fed-net:
    driver: bridge
